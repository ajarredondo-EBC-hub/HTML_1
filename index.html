<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura de la página</title>
</head>
<body>

    <!-- El encabezado de la página (usualmente logos, títulos principales) -->
    <header>
        <h1>Aquí va el encabezado (Header)</h1>
    </header>

    <!-- Barra de navegación (menús, enlaces a otras páginas) -->
    <nav>
        <p>Aquí va el menú de navegación (Nav)</p>
    </nav>

    <!-- El contenido principal e irrepetible de tu página -->
    <main>
        <h2>Aquí va el contenido principal (Main)</h2>
        
        <!-- Una sección dentro del contenido principal -->
        <section>
            <p>Aquí va una sección de contenido (Section)</p>
        </section>

        <!-- Contenido lateral (como barras de búsqueda, banners o enlaces extra) -->
        <aside>
            <p>Aquí va el contenido lateral o barra lateral (Aside)</p>
        </aside>
    </main>

    <!-- El pie de página (usualmente derechos de autor, contacto, redes sociales) -->
    <footer>
        <p>Aquí va el pie de página (Footer)</p>
    </footer>

</body>
</html>
